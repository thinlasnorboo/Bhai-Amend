kind = "web"
previewPath = "/"
title = "LA RC Hub"
version = "1.0.0"
id = "artifacts/la-rc-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21953

[services.development]
run = "pnpm --filter @workspace/la-rc-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/la-rc-hub", "run", "build" ]
publicDir = "artifacts/la-rc-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21953"
BASE_PATH = "/"
